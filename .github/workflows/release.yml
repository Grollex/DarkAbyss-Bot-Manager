name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.9.0"
        required: true
        type: string

jobs:
  build-and-verify:
    name: Build and verify Windows release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          DARKABYSS_REF_TYPE: ${{ github.ref_type }}
          DARKABYSS_REF_NAME: ${{ github.ref_name }}
          DARKABYSS_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:DARKABYSS_REF_TYPE -eq "tag") {
            $tag = $env:DARKABYSS_REF_NAME
            if (-not $tag.StartsWith("v")) {
              throw "Release tag must use v<version> format."
            }
            $version = $tag.Substring(1)
          } else {
            $version = $env:DARKABYSS_INPUT_VERSION
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "workflow_dispatch requires a version input."
            }
            $tag = "v$version"
          }
          $env:DARKABYSS_RELEASE_TAG = $tag
          $env:DARKABYSS_RELEASE_VERSION = $version
          python -c "import importlib.util, os, pathlib, sys; spec=importlib.util.spec_from_file_location('build_release_artifacts', pathlib.Path('packaging/build_release_artifacts.py')); m=importlib.util.module_from_spec(spec); sys.modules['build_release_artifacts']=m; spec.loader.exec_module(m); assert m.version_from_tag(os.environ['DARKABYSS_RELEASE_TAG']) == os.environ['DARKABYSS_RELEASE_VERSION']"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_name=darkabyss-release-assets-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile Python sources
        run: python -m compileall -q DarkAbyss_Core packaging tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
          # The default runner TEMP is an 8.3 short path (C:\Users\RUNNER~1);
          # tests compare temp paths with resolved ones.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v

      - name: Build packaged runtime
        run: .\build_windows.bat $env:RELEASE_VERSION

      - name: Create and verify release artifacts
        run: |
          python packaging\build_release_artifacts.py --version $env:RELEASE_VERSION --tag $env:RELEASE_TAG --distribution dist\DarkAbyssBotManager --output dist\release-artifacts
          python packaging\build_release_artifacts.py --verify-only --version $env:RELEASE_VERSION --distribution dist\DarkAbyssBotManager --output dist\release-artifacts

      - name: Verify artifact hygiene
        shell: pwsh
        run: |
          $expected = @(
            "darkabyss-release-$env:RELEASE_VERSION.zip",
            "darkabyss-release-$env:RELEASE_VERSION.zip.sha256",
            "DarkAbyssBotManager-$env:RELEASE_VERSION-windows.zip",
            "DarkAbyssBotManager-$env:RELEASE_VERSION-windows.zip.sha256"
          )
          $actual = Get-ChildItem -LiteralPath dist\release-artifacts -File | ForEach-Object { $_.Name } | Sort-Object
          $expectedSorted = $expected | Sort-Object
          if (@($actual).Count -ne @($expectedSorted).Count) {
            throw "Unexpected release artifact count: $($actual -join ', ')"
          }
          for ($i = 0; $i -lt $expectedSorted.Count; $i++) {
            if ($actual[$i] -ne $expectedSorted[$i]) {
              throw "Unexpected release artifact set: $($actual -join ', ')"
            }
          }

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            dist/release-artifacts/darkabyss-release-${{ steps.version.outputs.release_version }}.zip
            dist/release-artifacts/darkabyss-release-${{ steps.version.outputs.release_version }}.zip.sha256
            dist/release-artifacts/DarkAbyssBotManager-${{ steps.version.outputs.release_version }}-windows.zip
            dist/release-artifacts/DarkAbyssBotManager-${{ steps.version.outputs.release_version }}-windows.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-and-verify
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-and-verify.outputs.artifact_name }}
          path: release-artifacts

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/darkabyss-release-${{ needs.build-and-verify.outputs.release_version }}.zip
            release-artifacts/darkabyss-release-${{ needs.build-and-verify.outputs.release_version }}.zip.sha256
            release-artifacts/DarkAbyssBotManager-${{ needs.build-and-verify.outputs.release_version }}-windows.zip
            release-artifacts/DarkAbyssBotManager-${{ needs.build-and-verify.outputs.release_version }}-windows.zip.sha256
